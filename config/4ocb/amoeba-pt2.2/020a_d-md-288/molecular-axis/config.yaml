version: 1

system:
  molecule: 4ocb
  dataset: amoeba-pt2.2
  run_id: 020a_d-md-288
  temperature_k: 288

trajectory:
  path: /hickory/proj/cdpoonlab/users/emainas/tinker9-4ocb-x1000-pt2.2/020a_d-md-288/4ocb-x1000.arc
  format: tinker_arc
  molecules: 1000
  atoms_per_molecule: 36

# A zero stop means continue through the end of the trajectory.
frames:
  start: 1
  stop: 0
  stride: 1

molecular_axis:
  name: alekos-molzax
  # Exact legacy convention: MolZax = unit(r9 - r10).
  start_atom: 10
  end_atom: 9
  pbc: minimum_image
  normalize: true

output:
  path: data-processed/4ocb/amoeba-pt2.2/020a_d-md-288/molecular-axis/alekos-molzax/molecular-axis.bin
  overwrite: true

execution:
  mode: slurm

slurm:
  partition: general
  time: 02:00:00
  memory: 2G
  cpus_per_task: 1
  job_name: axis-4ocb-288
  # Add the cluster compiler module here if gfortran is not already on PATH.
  modules: []

fortran:
  compiler: gfortran
  flags:
    - -O3
    - -std=f2008

