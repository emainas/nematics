version: 1

system:
  molecule: 4ocb
  dataset: amoeba-pt2.2
  run_id: 020a_d-md-288
  temperature_k: 288

trajectory:
  path: /hickory/proj/cdpoonlab/users/emainas/tinker9-4ocb-x1000-pt2.2/020a_d-md-288/4ocb-x1000.arc
  format: tinker_arc
  molecules: 1000
  atoms_per_molecule: 36

# A zero stop means continue through the end of the trajectory.
frames:
  start: 1
  stop: 0
  stride: 1

molecular_axis:
  name: alekos-molzax-equivalent
  # 4OCB structural equivalent of Alekos's 5CB MolZax atom pair.
  start_atom: 11
  end_atom: 5
  pbc: minimum_image
  normalize: true

output:
  path: data-processed/4ocb/amoeba-pt2.2/020a_d-md-288/molecular-axis/molecular-axis.bin
  overwrite: false

slurm:
  partition: general_big
  account: rc_elipieri_pi
  time: 00:30:00
  memory: 512M
  cpus_per_task: 1
  job_name: axis-4ocb-288
  # Add the cluster compiler module here if gfortran is not already on PATH.
  modules: []

fortran:
  compiler: gfortran
  flags:
    - -O3
    - -std=f2008

