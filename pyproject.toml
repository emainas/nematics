[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nematics"
version = "0.1.0"
description = "Nematics analysis tools translated from legacy Fortran"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = [
  "matplotlib>=3.8",
  "pillow>=10",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.scripts]
nematics = "nematics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nematics"]

[tool.hatch.build.targets.wheel.force-include]
"config/datasets.toml" = "nematics/datasets.toml"

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
markers = [
  "integration: requires external trajectory data",
]
