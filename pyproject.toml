[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nematics"
version = "0.1.0"
description = "Nematics analysis tools translated from legacy Fortran"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.8", "tqdm>=4.66"]

[project.scripts]
nematics-paf = "nematics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nematics"]

[tool.pytest.ini_options]
addopts = "-q"
